# Split-KVN build of sing-box-extended: the upstream release plus one fix in
# wireguard-go (AmneziaWG 3.0 content padding, sing-box-extended issue #158).
# A tag v<upstream-version>-skvn<N> builds the router architectures and publishes
# a release with the same archive layout as upstream, plus SHA-256 sums.
name: skvn-release
on:
  push:
    tags: ['v*-skvn*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-arm64, goarch: arm64, tags: 'with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_openvpn,with_openconnect,with_acme,with_clash_api,with_tailscale,with_masque,with_mtproxy,with_ccm,with_ocm,with_cloudflared,with_usbip,with_trusttunnel,with_call,with_sudoku,with_manager,with_admin_panel,with_profiler,badlinkname,tfogo_checklinkname0' }
          - { name: linux-mipsle-softfloat, goarch: mipsle, gomips: softfloat, tags: 'with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_openvpn,with_openconnect,with_acme,with_clash_api,with_tailscale,with_masque,with_mtproxy,with_ccm,with_ocm,with_cloudflared,with_usbip,with_trusttunnel,with_call,with_sudoku,with_profiler,badlinkname,tfogo_checklinkname0' }
          - { name: linux-mips-softfloat, goarch: mips, gomips: softfloat, tags: 'with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_openvpn,with_openconnect,with_acme,with_clash_api,with_tailscale,with_masque,with_mtproxy,with_ccm,with_ocm,with_cloudflared,with_usbip,with_trusttunnel,with_call,with_sudoku,with_profiler,badlinkname,tfogo_checklinkname0' }
          - { name: linux-amd64, goarch: amd64, tags: 'with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_openvpn,with_openconnect,with_acme,with_clash_api,with_tailscale,with_masque,with_mtproxy,with_ccm,with_ocm,with_cloudflared,with_usbip,with_trusttunnel,with_call,with_sudoku,with_manager,with_admin_panel,with_profiler,badlinkname,tfogo_checklinkname0' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Admin panel files (embedded by with_admin_panel, as upstream)
        run: |
          cd service/admin_panel/web && npm install --no-fund --no-audit && npm run build && cd -
          go run ./cmd/internal/admin_panel_pack -dir service/admin_panel/dist
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
          GOFLAGS: -mod=mod
          GOTOOLCHAIN: local
        run: |
          set -xeuo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # the same tag sets as upstream .goreleaser.yaml (MIPS has no manager/admin panel)
          TAGS="${{ matrix.tags }}"
          mkdir -p "dist/sing-box-${VERSION}-${{ matrix.name }}"
          go build -v -trimpath -o "dist/sing-box-${VERSION}-${{ matrix.name }}/sing-box" -tags "${TAGS}" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${VERSION} -s -buildid= -checklinkname=0" \
            ./cmd/sing-box
          cp LICENSE "dist/sing-box-${VERSION}-${{ matrix.name }}/" || true
          cd dist && tar czf "sing-box-${VERSION}-${{ matrix.name }}.tar.gz" "sing-box-${VERSION}-${{ matrix.name }}"
          sha256sum "sing-box-${VERSION}-${{ matrix.name }}.tar.gz" > "sing-box-${VERSION}-${{ matrix.name }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.tar.gz*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && cat *.sha256 > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "sing-box-extended ${GITHUB_REF_NAME%-skvn*} + wireguard-go content padding buffer fix (sing-box-extended #158)." \
            *.tar.gz SHA256SUMS
